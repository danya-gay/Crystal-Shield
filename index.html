<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCD | КРИСТАЛЛ-ЩИТ</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin:0; font-family: sans-serif; background:#000; color:#0f0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transition: 0.5s; overflow:hidden; }
        .icon { font-size: 80px; margin-bottom: 20px; }
        .title { font-size: 26px; font-weight: bold; text-transform: uppercase; padding: 0 10px; }
        .desc { font-size: 16px; margin-top: 15px; opacity: 0.8; }
        #auth-btn { margin-top: 30px; padding: 15px 30px; background: #0f0; color: #000; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; box-shadow: 0 0 15px #0f0; z-index: 100; }
    </style>
</head>
<body>
    <div id="icon" class="icon">📡</div>
    <div id="title" class="title">СВЯЗЬ...</div>
    <div id="desc" class="desc">ОЖИДАНИЕ</div>
    <button id="auth-btn">ВКЛЮЧИТЬ ЗАЩИТУ</button>

    <script>
        const config = { databaseURL: "https://crystalshield-b8242-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(config);
        const db = firebase.database().ref('current_threat');

        const scenarios = {
            'safe': { b: '#001a00', c: '#0f0', i: '🛡️', h: 'БЕЗОПАСНО', d: 'ПОД ЗАЩИТОЙ АЛЬЯНСА' },
            'ballistic': { b: '#400', c: '#f00', i: '🚀', h: 'БАЛЛИСТИКА', d: 'УГРОЗА БАЛЛИСТИЧЕСКИХ РАКЕТ!' },
            'cruise': { b: '#400', c: '#f00', i: '🛫', h: 'КРЫЛАТЫЕ РАКЕТЫ', d: 'УГРОЗА КРЫЛАТЫХ РАКЕТ!' },
            'uav': { b: '#320', c: '#f90', i: '🛸', h: 'БпЛА', d: 'УГРОЗА УДАРНЫХ ДРОНОВ' },
            'kab': { b: '#420', c: '#f50', i: '💣', h: 'КАБ / ФАБ', d: 'УГРОЗА АВИАЦИОННЫХ БОМБ' },
            'artillery': { b: '#311', c: '#f33', i: '💥', h: 'ОБСТРЕЛ', d: 'УГРОЗА АРТИЛЛЕРИЙСКОГО ОБСТРЕЛА' },
            'drg': { b: '#111', c: '#fff', i: '🥷', h: 'ДИВЕРСАНТЫ', d: 'ПОВЫШЕННАЯ АКТИВНОСТЬ ДРГ' },
            'street_combat': { b: '#200', c: '#fff', i: '☠️', h: 'УЛИЧНЫЕ БОИ', d: 'ВНИМАНИЕ! БОЕВЫЕ ДЕЙСТВИЯ В ГОРОДЕ' }
        };

        let lastStatus = null;
        let isFirstLoad = true;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        document.getElementById('auth-btn').onclick = function() {
            Notification.requestPermission().then(perm => {
                if (perm === 'granted') {
                    this.style.display = 'none';
                    // Принудительно запускаем аудио-контекст, чтобы звуки работали позже
                    const silentAudio = new Audio('https://actions.google.com/sounds/v1/alarms/emergency_it_is_drastic.ogg');
                    silentAudio.volume = 0;
                    silentAudio.play().catch(() => {});
                }
            });
        };

        async function sendPush(cfg) {
            if (Notification.permission === 'granted') {
                const reg = await navigator.serviceWorker.ready;
                reg.showNotification(`СИСТЕМА ЩИТ: ${cfg.h}`, {
                    body: cfg.d,
                    icon: 'https://cdn-icons-png.flaticon.com/512/564/564619.png',
                    vibrate: [500, 100, 500],
                    tag: 'rcd-alert',
                    renotify: true
                });
            }
        }

        function triggerAlarm(mode, cfg) {
            // Уведомление теперь шлем ВСЕГДА (и для safe тоже)
            sendPush(cfg);

            if (mode !== 'safe') {
                if (navigator.vibrate) navigator.vibrate([800, 300, 800]);
                let alarm = new Audio('https://actions.google.com/sounds/v1/alarms/emergency_it_is_drastic.ogg');
                alarm.play().catch(() => console.log("Звук заблокирован, нужен клик"));
            }
        }

        // Слушаем базу
                // Слушаем базу
        db.on('value', (snapshot) => {
            const mode = snapshot.val() || 'safe';
            const cfg = scenarios[mode] || scenarios['safe'];
            
            // Обновляем визуал (работает всегда при входе)
            document.body.style.backgroundColor = cfg.b;
            document.body.style.color = cfg.c;
            document.getElementById('icon').innerText = cfg.i;
            document.getElementById('title').innerText = cfg.h;
            document.getElementById('desc').innerText = cfg.d;

            if (isFirstLoad) {
                lastStatus = mode;
                isFirstLoad = false;
            } else if (mode !== lastStatus) {
                triggerAlarm(mode, cfg);
                lastStatus = mode;
            }
        });

        // --- УСИЛИТЕЛЬ ДЛЯ ФОНОВОЙ РАБОТЫ ---

        // 1. Принудительное переподключение при потере связи
        firebase.database().ref(".info/connected").on("value", (snap) => {
            if (snap.val() === false) {
                // Если связь пропала, пробуем переподключиться вручную
                firebase.database().goOnline();
            }
        });

        // 2. Heartbeat в отдельную папку (чтобы не сбрасывать статус)
        const aliveRef = firebase.database().ref('heartbeat'); 
        setInterval(() => {
            // Пишем в базу, только если вкладка скрыта (чтобы "будить" Chrome)
            if (document.visibilityState === 'hidden') {
                aliveRef.set(firebase.database.ServerValue.TIMESTAMP);
            }
        }, 20000); // Раз в 20 секунд - это оптимально для Android

        // 3. Авто-обновление при возврате в браузер
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // Если мы вернулись в приложение, проверяем актуальность данных
                firebase.database().goOnline();
            }
        });

    </script>
</body>
</html>
