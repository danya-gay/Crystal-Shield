<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЦУП ЛИДЕРА | КРАСНЫЙ КРИСТАЛЛ</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background:#0a0a0a; color:#eee; font-family: sans-serif; padding:10px; text-align:center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 500px; margin: 20px auto; }
        .btn { padding:20px 10px; font-weight:bold; cursor:pointer; border-radius:4px; border:1px solid #444; color:#fff; text-transform:uppercase; }
        .btn-safe { background:#050; grid-column: span 2; border-color:#0f0; font-size:18px; }
        .btn-danger { background:#600; }
        .btn-warn { background:#740; }
        .btn-spec { background:#333; }
    </style>
</head>
<body id="admin-body" style="display:none;">
    <h2 style="color:#0f0">ЦУП: ГЛАВНЫЙ ТЕРМИНАЛ</h2>
    <div class="grid">
        <button class="btn btn-safe" onclick="set('safe')">🛡️ ОТБОЙ</button>
        <button class="btn btn-danger" onclick="set('ballistic')">🚀 БАЛЛИСТИКА</button>
        <button class="btn btn-danger" onclick="set('cruise')">🛫 КР. РАКЕТЫ</button>
        <button class="btn btn-warn" onclick="set('uav')">🛸 БпЛА</button>
        <button class="btn btn-warn" onclick="set('kab')">💣 КАБ / ФАБ</button>
        <button class="btn btn-danger" onclick="set('artillery')">💥 ОБСТРЕЛ</button>
        <button class="btn btn-spec" onclick="set('drg')">🥷 ДРГ</button>
        <button class="btn btn-spec" onclick="set('street_combat')" style="grid-column: span 2;">☠️ УЛИЧНЫЕ БОИ</button>
    </div>

    <script>
        const pass = prompt("КОД ЛИДЕРА:");
        if(pass === "ЮТРКЧАГБ") {
            document.getElementById('admin-body').style.display = 'block';
        } else { window.location.href = "about:blank"; }

        firebase.initializeApp({ databaseURL: "https://crystalshield-b8242-default-rtdb.europe-west1.firebasedatabase.app/" });
        const db = firebase.database().ref('current_threat');

        function set(mode) {
            db.set(mode).then(() => console.log("Отправлено: " + mode));
        }
    </script>
</body>
</html>
