<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЦУП ЛИДЕРА | ЮЖНАЯ ЗАГОРИЯ</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background:#0a0a0a; color:#eee; font-family: sans-serif; padding: 15px; text-align:center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { padding: 22px 10px; font-size: 13px; font-weight: bold; border: 1px solid #444; cursor: pointer; border-radius: 4px; color: #fff; text-transform: uppercase; }
        .btn-safe { background: #050; grid-column: span 2; font-size: 18px; border-color: #0f0; }
        .btn-danger { background: #600; }
        .btn-warning { background: #740; }
        .btn-special { background: #333; }
    </style>
</head>
<body id="admin-body" style="display:none;">
    <h3 style="color:#0f0">ЦУП: ПУЛЬТ УПРАВЛЕНИЯ</h3>
    <div class="grid">
        <button class="btn btn-safe" onclick="send('safe')">🛡️ ОТБОЙ</button>
        <button class="btn btn-danger" onclick="send('ballistic')">🚀 БАЛЛИСТИКА</button>
        <button class="btn btn-danger" onclick="send('cruise')">🛫 КР. РАКЕТЫ</button>
        <button class="btn btn-warning" onclick="send('uav')">🛸 БпЛА</button>
        <button class="btn btn-warning" onclick="send('kab')">💣 КАБ / ФАБ</button>
        <button class="btn btn-danger" onclick="send('artillery')">💥 ОБСТРЕЛ</button>
        <button class="btn btn-special" onclick="send('drg')">🥷 ДРГ</button>
        <button class="btn btn-special" onclick="send('street_combat')" style="grid-column: span 2;">☠️ УЛИЧНЫЕ БОИ</button>
    </div>

    <script>
        const pass = prompt("КОД ЛИДЕРА:");
        if(pass === "ЮТРКЧАГБ") { 
            document.getElementById('admin-body').style.display = 'block';
        } else { window.location.href = "about:blank"; }

        firebase.initializeApp({ databaseURL: "https://crystalshield-b8242-default-rtdb.europe-west1.firebasedatabase.app/" });
        const db = firebase.database().ref('current_threat');

        function send(type) {
            db.set(type).then(() => { 
                console.log("Сигнал подан: " + type); 
            }).catch(err => alert("ОШИБКА: " + err));
        }
    </script>
</body>
</html>
